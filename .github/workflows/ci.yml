# Runs every test suite on each push and pull request:
#   analyzer  - ruff, mypy and pytest inside the analyzer test image
#   backend   - Maven verify with Testcontainers (real PostgreSQL + real analyzer image)
#   frontend  - type check and Vitest inside the frontend test image
#   e2e       - Playwright smoke test in Chromium against the Docker Compose stack
#   api-contract (pull requests only) - API Sentinel's own CLI compares the backend
#              contract on the base branch with the PR version and fails on breaking changes
# The analyzer and frontend jobs run scripts/test-*.sh, the bash equivalents of the PowerShell scripts.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      backend_script:
        description: Also run scripts/test-backend.sh (Maven inside the toolchain container)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on pull requests only; every commit on main gets a full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyzer:
    name: Analyzer (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Lint, type check and tests (scripts/test-analyzer.sh)
        run: bash scripts/test-analyzer.sh

      - name: Show the full log on failure
        if: failure()
        run: cat logs/analyzer-tests.txt

  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build analyzer image used by the integration tests
        run: docker build -f analyzer/Dockerfile --target runtime -t apisentinel-analyzer:latest .

      - name: Tests (mvn verify with Testcontainers)
        working-directory: backend
        run: sh ./mvnw -B -ntp verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: backend-surefire-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/contract/
          if-no-files-found: ignore

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Type check, tests and production build (scripts/test-frontend.sh)
        run: bash scripts/test-frontend.sh

      - name: Show the full log on failure
        if: failure()
        run: cat logs/frontend-tests.txt

  scripts:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/test-analyzer.sh scripts/test-backend.sh scripts/test-frontend.sh

  backend-script:
    name: Backend via scripts/test-backend.sh (on demand)
    if: github.event_name == 'workflow_dispatch' && inputs.backend_script
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/test-backend.sh
      - name: Show the end of the log on failure
        if: failure()
        run: tail -n 200 logs/backend-tests.txt

  e2e:
    name: Browser smoke test (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Generate throw-away secrets for this run (never committed)
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "APISENTINEL_JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "APISENTINEL_INTERNAL_TOKEN=$(openssl rand -hex 32)"
          } > .env

      - name: Start the stack and wait for every health check
        run: docker compose -f infrastructure/docker-compose.yml --env-file .env up -d --build --wait --wait-timeout 600

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Smoke test (register, upload, compatibility scan)
        working-directory: e2e
        run: npx playwright test

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f infrastructure/docker-compose.yml --env-file .env logs --no-color --tail 200

  api-contract:
    name: API contract (checked by API Sentinel)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect the base and PR versions of the backend contract
        id: contract
        run: |
          mkdir -p "$RUNNER_TEMP/contract"
          cp contracts/backend-api.openapi.json "$RUNNER_TEMP/contract/candidate.json"
          if git show "origin/$BASE_REF:contracts/backend-api.openapi.json" > "$RUNNER_TEMP/contract/baseline.json" 2>/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No backend contract on $BASE_REF yet, so there is nothing to compare."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the analyzer image (it contains the apisentinel CLI)
        if: steps.contract.outputs.present == 'true'
        run: docker build -f analyzer/Dockerfile --target runtime -t apisentinel-analyzer:latest .

      - name: Compare with apisentinel diff (fails on high or critical findings)
        if: steps.contract.outputs.present == 'true'
        run: >
          docker run --rm -v "$RUNNER_TEMP/contract:/contract:ro" apisentinel-analyzer:latest
          apisentinel diff /contract/baseline.json /contract/candidate.json --fail-on high --color never
