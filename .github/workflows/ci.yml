# Runs all three test suites on every push to main and every pull request:
#   analyzer  - Python: ruff, mypy, pytest (372 tests)
#   backend   - Java 21 / Spring Boot via the Maven Wrapper; integration tests start real
#               PostgreSQL 18 and the real analyzer image with Testcontainers (54 tests)
#   frontend  - React: type check, Vitest (43 tests), production build
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyzer:
    name: analyzer (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: analyzer/uv.lock
      - name: Install Python 3.14 and locked dependencies
        run: |
          uv python install 3.14
          uv sync --locked --python 3.14
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Type check (mypy)
        run: uv run mypy src
      - name: Tests (pytest)
        run: uv run pytest -q -p no:cacheprovider

  backend:
    name: backend (Maven + Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # The integration tests start this image (TestContainers.ANALYZER_IMAGE), so build it first.
      - name: Build the analyzer image used by the integration tests
        run: docker build -f analyzer/Dockerfile --target runtime -t apisentinel-analyzer:latest .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build and test (mvnw verify)
        working-directory: backend
        run: ./mvnw -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: frontend (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Tests (Vitest)
        run: npm test
      - name: Production build
        run: npx vite build
