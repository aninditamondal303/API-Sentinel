[project]
name = "apisentinel"
version = "0.1.0"
description = "Deterministic breaking-change analysis for OpenAPI 3.0 and 3.1 specifications."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "PyYAML==6.0.4",
    "fastapi==0.165.0",
    "jsonschema==4.26.0",
    "openapi-spec-validator==0.9.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "uvicorn==0.54.0",
]

[project.scripts]
apisentinel = "apisentinel.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.17",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "types-PyYAML==6.0.12.20261113",
    "httpx2==2.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apisentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "SIM108"]

[tool.ruff.lint.per-file-ignores]
# Rule tables are easier to review with one case per line.
"tests/test_rules.py" = ["E501"]
"tests/test_hygiene.py" = ["E501"]
# Long assertion/call lines in tests are kept on one line with fmt: skip for readability.
"tests/test_api.py" = ["E501"]
"tests/test_testgen.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["apisentinel"]

[[tool.mypy.overrides]]
module = ["openapi_spec_validator.*", "jsonschema.*"]
ignore_missing_imports = true
