# Render Blueprint: free public deployment of API Sentinel (no credit card on Render's free plan).
#
#   api-sentinel-app  static site   React build; rewrites /api/* to the backend, so the browser
#                                   talks to one origin (same as nginx does locally).
#   api-sentinel-api  web service   Spring Boot backend + Python analyzer in one container
#                                   (deploy/render/Dockerfile). The analyzer listens on
#                                   127.0.0.1 only and is never reachable from outside.
#   PostgreSQL        Neon free plan (permanent, no card). Paste its connection string into
#                     DATABASE_URL when Render asks during Blueprint creation.
#
# Secrets: the JWT key and the internal analyzer token are generated by Render
# (random base64 256-bit values) and are never stored in this repository.
# The local Docker Compose setup is unaffected by this file.

services:
  - type: web
    runtime: docker
    name: api-sentinel-api
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    # Liveness, not readiness: readiness checks the database, and probing it every few seconds
    # would keep the Neon database from ever scaling to zero (free compute hours).
    healthCheckPath: /actuator/health/liveness
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APISENTINEL_JWT_SECRET
        generateValue: true
      - key: APISENTINEL_INTERNAL_TOKEN
        generateValue: true
      # Close idle database connections so Neon can suspend its compute when nobody is using the app.
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "0"
      - key: SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT
        value: "60000"
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"

  - type: web
    runtime: static
    name: api-sentinel-app
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://api-sentinel-api.onrender.com/api/*
      - type: rewrite
        source: /actuator/health
        destination: https://api-sentinel-api.onrender.com/actuator/health
      # Single-page app: every other unknown path renders index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    # Same security headers as frontend/nginx/security-headers.conf.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
