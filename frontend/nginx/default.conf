# Serves the React build and forwards API calls to the Spring Boot backend on the internal Docker
# network. The browser only sees this origin, so no CORS is needed and the analyzer stays private.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Spec uploads are limited to 5 MB by the backend; allow the multipart overhead.
    client_max_body_size 6m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Scans call the analyzer synchronously (backend read timeout is 30 s).
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Actuator: only the health endpoint and its groups (liveness/readiness) are forwarded.
    # Exact and ^~ prefix matches so "/actuator/healthx" and friends are not proxied either.
    location = /actuator/health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /actuator/health/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Every other actuator path is refused here with a real 404 (not proxied, not the SPA fallback).
    location ^~ /actuator {
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        return 404 "Not found\n";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Single-page app: unknown paths render index.html; the router shows its own 404.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
