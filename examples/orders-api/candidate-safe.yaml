# Additive-only changes to baseline.yaml: should PASS.
openapi: 3.1.0
info:
  title: Orders API
  version: 1.5.0
servers:
- url: https://api.example-shop.com/v1
security:
- bearerAuth: []
paths:
  /orders:
    get:
      operationId: listOrders
      summary: List orders
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/OrderStatus'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: createdAfter
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: A page of orders
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  nextCursor:
                    type:
                    - string
                    - 'null'
    post:
      operationId: createOrder
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '422':
          description: Validation failed
  /orders/{id}:
    parameters: &id001
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getOrder
      summary: Get one order
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Not found
    delete:
      operationId: deleteOrder
      summary: Delete an order
      responses:
        '204':
          description: Deleted
  /orders/{id}/receipt:
    parameters: *id001
    get:
      operationId: getReceipt
      summary: Download a receipt
      responses:
        '200':
          description: Receipt
          content:
            application/pdf:
              schema:
                type: string
                format: binary
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OrderStatus:
      type: string
      enum:
      - PENDING
      - PAID
      - SHIPPED
      - CANCELLED
    LineItem:
      type: object
      required:
      - sku
      - quantity
      properties:
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
    NewOrder:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LineItem'
        couponCode:
          type: string
        notes:
          type: string
          maxLength: 500
        giftWrap:
          type: boolean
          default: false
    Order:
      type: object
      required:
      - id
      - status
      - items
      - total
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
        total:
          type: number
        customerEmail:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
        trackingUrl:
          type: string
          format: uri
